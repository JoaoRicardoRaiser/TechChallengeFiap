apiVersion: v1
kind: Pod
metadata:
  name: grafana-pod
  labels:
    app: grafana
spec:
  containers:
    - name: grafana
      image: grafana/grafana:latest
      ports:
        - containerPort: 3000
      resources:
        requests:
          memory: "256Mi"
          cpu: "250m"
        limits:
          memory: "512Mi"
          cpu: "500m"
      volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-datasource
          mountPath: /etc/grafana/provisioning/datasources
  volumes:
    - name: grafana-storage
      emptyDir: {}
    - name: grafana-datasource
      configMap:
        name: grafana-datasource-config