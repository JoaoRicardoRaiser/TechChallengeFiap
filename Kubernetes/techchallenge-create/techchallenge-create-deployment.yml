apiVersion: apps/v1
kind: Deployment
metadata:
  name: techchallenge-create
spec:
  replicas: 2
  selector:
    matchLabels:
      app: techchallenge-create
  template:
    metadata:
      labels:
        app: techchallenge-create
    spec:
      containers:
        - name: techchallenge-create
          image: joaoraiser12/techchallenge-create:2.0
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          envFrom:
            - secretRef:
                name: techchallenge-create-secrets
