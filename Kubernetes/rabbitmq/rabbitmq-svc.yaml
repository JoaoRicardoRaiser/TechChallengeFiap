apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-service
spec:
  type: NodePort
  selector:
    app: rabbitmq
  ports:
    - port: 5672        # porta interna do container
      targetPort: 5672  # porta do Pod/container
      nodePort: 30008   # porta exposta na máquina (entre 30000-32767)
      name: application
    - port: 15672        # porta interna do container
      targetPort: 15672  # porta do Pod/container
      nodePort: 30009   # porta exposta na máquina (entre 30000-32767)
      name: management