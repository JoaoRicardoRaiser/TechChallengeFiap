name: tech_challenge

services:
  postgres:
    image: postgres:16.4-alpine3.20
    container_name: postgres
    environment:
      - POSTGRES_PASSWORD=postgres
    ports:
      - 5432:5432
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks:
      - tech_challenge_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  rabbitMq:
    image: rabbitmq:3-management
    container_name: rabbitMq
    ports:
      - 15672:15672
      - 5672:5672
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - tech_challenge_network
    healthcheck:
      test: [
      "CMD-SHELL",
      "rabbitmq-diagnostics status"
    ]
      interval: 10s
      timeout: 5s
      retries: 10
  
  create-contact-app:
    build: src/TechChallenge.CreateContact
    container_name: create-contact-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "8080:8080"
    networks:
      - tech_challenge_network
    depends_on:
      postgres:
          condition: service_healthy
      rabbitMq:
          condition: service_healthy
          
  delete-contact-app:
    build: src/TechChallenge.DeleteContact
    container_name: delete-contact-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "8081:8080"
    networks:
      - tech_challenge_network
    depends_on:
      postgres:
          condition: service_healthy
      rabbitMq:
          condition: service_healthy         

  update-contact-app:
    build: src/TechChallenge.UpdateContact
    container_name: update-contact-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    ports:
      - "8082:8080"
    networks:
      - tech_challenge_network
    depends_on:
      postgres:
          condition: service_healthy
      rabbitMq:
          condition: service_healthy   

